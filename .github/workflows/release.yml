name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid package version'; exit 1; }
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Release tag must match Cargo.toml'; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref==\"refs/tags/$TAG\") | .object.sha")
          if [[ -n "$EXISTING" && "$GITHUB_REF" == refs/heads/main ]]; then
            echo "Version $TAG already has a tag; bump Cargo.toml for the next release."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev desktop-file-utils
      - run: cargo test --locked && cargo build --locked --release
      - run: desktop-file-validate packaging/aseprite-metadata-editor.desktop
      - run: bash tests/linux-installer.sh
      - run: packaging/appimage.sh
      - name: Verify packaged launcher icon
        run: |
          (cd dist && ./Aseprite-Metadata-Editor-linux-x86_64.AppImage --appimage-extract >/dev/null)
          cmp assets/icon-256.png dist/squashfs-root/.DirIcon
          cmp assets/icon-256.png dist/squashfs-root/usr/share/icons/hicolor/256x256/apps/aseprite-metadata-editor.png
          desktop-file-validate dist/squashfs-root/aseprite-metadata-editor.desktop
          rm -rf dist/squashfs-root
      - name: Attach user-local Linux installer and original icon
        run: |
          install -m755 packaging/install-linux.sh dist/install-linux.sh
          install -m644 assets/icon-256.png dist/aseprite-metadata-editor.png
          (cd dist && sha256sum *.AppImage *.sh *.png > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*
  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked; if ($LASTEXITCODE) { exit $LASTEXITCODE }; cargo build --locked --release
      - name: Build per-user installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          Push-Location packaging
          & $nsis windows.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          $hash = (Get-FileHash packaging/Aseprite-Metadata-Editor-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Aseprite-Metadata-Editor-windows-x64-setup.exe" | Set-Content -Encoding ascii packaging/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            packaging/*-setup.exe
            packaging/SHA256SUMS-windows.txt
  publish:
    needs: [plan, linux, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checked build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          EXISTING=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref==\"refs/tags/$RELEASE_TAG\") | .object.sha")
          if [[ -n "$EXISTING" ]]; then
            TARGET=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            [[ "$TARGET" == "$GITHUB_SHA" ]] || { echo 'Existing tag belongs to another commit; refusing to replace it'; exit 1; }
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Aseprite Metadata Editor desktop builds. The Windows installer is unsigned; Windows may show a publisher warning. Linux requires x86_64, glibc 2.35 or newer and working system graphics drivers. Source and BSD-3-Clause license are available in this repository.'
          fi
