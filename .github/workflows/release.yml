name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev desktop-file-utils
      - run: cargo test --locked && cargo build --locked --release
      - run: desktop-file-validate packaging/aseprite-metadata-editor.desktop
      - run: packaging/appimage.sh
      - run: sha256sum dist/*.AppImage > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked; if ($LASTEXITCODE) { exit $LASTEXITCODE }; cargo build --locked --release
      - name: Build per-user installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          Push-Location packaging
          & $nsis windows.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          $hash = (Get-FileHash packaging/Aseprite-Metadata-Editor-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Aseprite-Metadata-Editor-windows-x64-setup.exe" | Set-Content -Encoding ascii packaging/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            packaging/*-setup.exe
            packaging/SHA256SUMS-windows.txt
  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish checked build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "$RELEASE_TAG" --notes 'Aseprite Metadata Editor desktop builds. The Windows installer is unsigned; Windows may show a publisher warning. Linux requires x86_64, glibc 2.35 or newer and working system graphics drivers. Source and BSD-3-Clause license are available in this repository.'
          fi
