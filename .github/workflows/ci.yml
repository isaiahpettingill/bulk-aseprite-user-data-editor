name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev xvfb xdotool x11-utils cmake libkf5iconthemes-dev
      - name: Linux launcher installation tests
        if: runner.os == 'Linux'
        run: bash tests/linux-installer.sh
      - name: KDE icon theme collision regression
        if: runner.os == 'Linux'
        run: bash tests/kde-icon.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - name: Verify Linux window identity and icon
        if: runner.os == 'Linux'
        run: ASEPRITE_TEST_XVFB=1 xvfb-run -a bash tests/linux-window.sh
      - name: Compile Windows installer (includes destination chooser)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          Push-Location packaging
          & $nsis windows.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
      - name: Windows installer preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-preview
          path: packaging/*-setup.exe
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: cargo install trunk --version 0.21.14 --locked
      - run: trunk build --release --public-url /bulk-aseprite-user-data-editor/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-preview
          path: dist
      - name: Browser file-picker unit tests
        run: node --test tests/web-files.test.cjs
      - name: Browser smoke test
        run: |
          trunk build --release --public-url /
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8774 --directory dist > /tmp/web-server.log 2>&1 &
          node tests/web-smoke.cjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-smoke
          path: web-*.png
          if-no-files-found: ignore
